apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillbridge-api
spec:
  replicas: 3
  selector:
    matchLabels: { app: skillbridge-api }
  template:
    metadata:
      labels: { app: skillbridge-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/skillbridge/api:latest
          ports: [{ containerPort: 4000 }]
          envFrom: [{ secretRef: { name: skillbridge-env } }]
          readinessProbe:
            httpGet: { path: /healthz, port: 4000 }
